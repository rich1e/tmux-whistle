# tmux-whistle —— 由 tmux-whistle.tmux 通过 tmux source-file 载入。
#
# 加载时机（KP-10）：oh-my-tmux 已经把 window-status-format 设成最终态，
# 此时做幂等 patch 是安全的。
#
# 整份文件必须可重复执行：prefix r、tpm install、插件更新都会重新 source。
#
# 路径通过 @whistle_root 传进来 —— tmux conf 里没有 __FILE__，
# 只能由入口脚本（或 install.sh）先写进这个 option。

# 绑定：prefix + W 打开待处理菜单。
# w 已被 oh-my-tmux 的 choose-tree 占用；W 是空的。
bind-key -T prefix W run-shell -b '"#{@whistle_root}/bin/tmux-whistle" menu' \
    \; display-message 'whistle 菜单'

# 其余逻辑（option 默认值、幂等 patch、hook 注册）在 shell 侧做，
# 因为要 source lib/*.sh，而 tmux conf 里做不到。
#
# 为什么要 -d 0.5：oh-my-mux 会先把本文件（经 tmux.conf.local）source 进来，
# **之后**才重算主题并重新 set-option status-right / window-status-format。
# 我们的补丁如果立刻跑，会被主题覆盖掉。延迟半秒让补丁落在主题计算之后。
# 这一步同时是幂等的，重复 source 不会叠出双徽章。
# 显式把当前 server 的 socket 传给 setup.sh：
# $TMUX_SOCKET 是从父进程继承的，可能还指向另一个 server；
# #{socket_path} 由 tmux 在**当前** server 里展开，没有歧义。
run-shell -b -d 0.5 '"#{@whistle_root}/scripts/setup.sh" "#{socket_path}"'